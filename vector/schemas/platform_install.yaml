      - orchestrator
      - skills
      - kb
  windsurf:
    load_order:
      - skills
      - orchestrator
      - kb
  codex:
    load_order:
      - repo_instructions
      - tasks
      - kb
  manus:
    load_order:
      - skill_pack
      - orchestrator
      - kb
  lovable:
    load_order:
      - knowledge
      - compact_instructions
