verification:
  - load_order_verified
  - kb_location_verified
  - orchestrator_loaded
  - first_artifact_emitted
  - kb_synced_after_turn
fallback:
  mode: quick_start
  reason: if platform install is incomplete, start with the shortest reliable path

v1_5_enhancements:
  adapter_principles:
    - preserve_canonical_schema_first
    - keep_skill_loading_order_explicit
    - keep_kb_sync_visible
    - prefer_reviewable_outputs
  skill_registry_note:
    - if the platform supports reusable skill folders, group related skills together
    - if the platform supports only instructions, compress the same routing logic into a single stable instruction pack
